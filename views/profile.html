{{block "profile" .}}
<div id="login-container"
     class="ease-all"
     style="height:100vh;opacity:1"
     hx-get="/login-cancel"
     hx-target="#login-container"
     hx-trigger="click target:#login-container, escapePressed from:body"
     hx-swap="outerHTML">
    <div id="login-form">
        <a href="#" class="close-button" hx-get="/login-cancel" hx-target="#login-container" hx-swap="outerHTML">
            <svg width="100" height="100" viewBox="0 0 100 100">
                <path d="M20 20 L80 80 M80 20 L20 80" stroke="var(--fgcolor)" stroke-width="5" fill="none"/>
            </svg>
        </a>
        <h3>sign in</h3>
        <form hx-post="/login" hx-swap="outerHTML">
            <label for="login-username">Username:</label>
            <input id="login-username" name="username" type="name" placeholder="username"
                   autocomplete="username" required autofocus value="{{.Username}}">
            <label for="login-password">Password:</label>
            <input id="login-password" name="password" type="password" placeholder="password"
                   autocomplete="current-password" required>
            <div id="login-error-message" class="error">{{.Error}}</div>
            <input type="submit" value="sign in" class="" style="">
        </form>
    </div>
</div>
{{end}}
